<div th:fragment="delete" class="modal fade text-center" id="confirmModal" th:if="${apiary != null}">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" th:text="#{modal.delete.title}">Delete Confirmation</h5>
                <button type="button" class="close" data-dismiss="modal">
                    <span aria-hidden="true">&times;</span>
                </button>
            </div>

            <div class="modal-body">
                <span id="confirmText"></span>
            </div>

            <div class="modal-footer">
                <a type="button" id="yesBtn" class="btn btn-warning" th:value="#{button.yes}">Yes</a>
                <button type="button" class="btn btn-secondary btn-default" data-bs-dismiss="modal"
                        th:value="#{button.no}">No
                </button>
            </div>
        </div>
    </div>
</div>
